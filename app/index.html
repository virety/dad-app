      <div class="chips">${section.categories.filter(c => c.items.length).map(c => `<button class="chip" data-cat="${c.id}">${esc(L(c.title))}</button>`).join("")}</div>
      ${section.categories.filter(c => c.items.length).map(c => `<div class="heading" id="cat-${c.id}"><h2>${esc(L(c.title))}</h2><span>${t("Ккал / Б / Ж / У", "Kcal / P / F / C")}</span></div><div class="items">${c.items.map(itemRow).join("")}</div>`).join("")}
      ${installHint()}
      <footer>${t("Временные фото: ", "Temporary photos: ")}<a href="https://commons.wikimedia.org" target="_blank" rel="noopener">Wikimedia Commons</a> (CC BY / CC BY-SA) ·
        ${t("КБЖУ рассчитаны по техкартам; при аллергии уточните состав у бариста.", "Nutrition is calculated from recipe cards; if you have an allergy, please check with the barista.")}</footer>`;
  }
  return `<div class="page wide">${topBar()}${search}${body}</div>`;
}

function installHint() {
  const standalone = window.navigator.standalone || matchMedia("(display-mode: standalone)").matches;
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  if (standalone || !ios || store.get("hintClosed", false)) return "";
  return `<div class="install"><b>${t("Установите DAD на iPhone", "Install DAD on your iPhone")}</b>
    ${t("Нажмите «Поделиться» ⬆︎ внизу Safari, затем «На экран „Домой“». Приложение появится рядом с остальными.",
      "Tap Share ⬆︎ at the bottom of Safari, then “Add to Home Screen”. DAD appears next to your other apps.")}
    <div><button class="link" data-act="hint">${t("Понятно", "Got it")}</button></div></div>`;
}

function renderCustomization(variant, selection, index = null) {
  const inCart = index !== null;
  const suffix = inCart ? String(index) : "item";
  const selected = omissionIds(selection);
  const sauce = variant.removableSauce;
  const ingredients = eligibleIngredients(variant);
  const options = [
    sauce ? `<button class="chip ${selection.noSauce === true ? "on" : ""}" ${inCart ? `data-cart-sauce="${index}"` : 'data-item-sauce="true"'}
      aria-pressed="${selection.noSauce === true}">${esc(withoutSauce(sauce.name))}</button>` : "",
    ...ingredients.map(ingredient => {
      const on = selected.includes(ingredient.id);
      return `<button class="chip ${on ? "on" : ""}" data-omit="${esc(ingredient.id)}" data-options-for="${suffix}" aria-pressed="${on}">
        ${esc(L(ingredient.name))}</button>`;
    }),
  ].join("");
  const commentLabel = t("Комментарий к позиции", "Comment for this item");
  const excluded = excludedComponents(variant, selection);
  const nutrition = excluded.length ? portionNutrition(variant, excluded) : null;
  const optionsLabel = t("Убрать из порции", "Remove from this serving");
  return `<div class="customization">
    ${options ? `<span class="order-item-note">${optionsLabel}</span><div class="wrap" role="group" aria-label="${optionsLabel}">${options}</div>` : ""}
    ${inCart && excluded.length ? `<span class="order-item-note">${nutrition
      ? esc(t("На порцию", "Per serving") + " ≈ " + kbju({ ...nutrition, kcal: Math.round(nutrition.kcal) }))
      : t("КБЖУ для этого состава пока нет", "Nutrition for these options is unavailable")}</span>` : ""}
    <details id="customization-${suffix}" ${itemComment(selection.item_comment) ? "open" : ""}><summary>${commentLabel}</summary>
      <textarea class="field" id="item-comment-${suffix}" aria-label="${commentLabel}" rows="2"
        maxlength="${ITEM_COMMENT_LIMIT}" placeholder="${t("Напишите пожелание для кухни", "Leave a note for the kitchen")}">${esc(selection.item_comment)}</textarea></details>
  </div>`;
}

  const allSortPrices = (item.flavors || []).map(f => sortPrice(item, v, f.id)), showSortPrices = new Set(allSortPrices.filter(x => x != null)).size > 1;
  const groups = [...new Set((item.flavors || []).map(f => JSON.stringify(f.group || null)))].map(g => JSON.parse(g));

    <div class="body stack">
      <div><h3>${esc(L(item.name))}</h3>${S.lang === "ru" ? `<div class="muted">${esc(item.name.en)}</div>` : ""}
        ${itemAvailable(item) ? "" : `<div class="warn" style="font-weight:800;margin-top:6px">⏱ ${t("Сейчас нет в наличии", "Out of stock right now")}</div>`}
        ${promo ? `<div class="warn" style="font-weight:800;margin-top:8px"><span class="pct">−${promo.percent}%</span> ${esc(promoTitle(promo))} · ${promoHours(promo)}</div>` : ""}
        ${left && itemAvailable(item) && left.left_units > 0 && left.left_units <= (left.cut ? 24 : 5) ? `<div class="warn" style="font-weight:700;margin-top:6px">${t("Осталось на витрине: ", "Left on the counter: ")}${stockText(left)}</div>` : ""}
        ${item.description ? `<p style="margin:10px 0 0;font-size:14px">${esc(L(item.description))}</p>` : ""}
        ${addonsFor(item).length ? `<p style="margin:8px 0 0;font-size:13px;font-weight:600">${t("Можно добавить: ", "You can add: ")}${esc([...new Set(addonsFor(item).map(a => a.kind.toLowerCase()))].join(", "))}${t(" — предложим при заказе", " — offered when you add it")}</p>` : ""}
        ${item.ingredients ? `<p class="note" style="margin:6px 0 0">${t("Состав: ", "Ingredients: ")}${esc(L(item.ingredients))}</p>` : ""}</div>
      ${isCut(item) ? `<div class="label">${t("Порция", "Portion")}</div><div class="wrap">${item.variants.map(c => { const cp = sortPrice(item, c, null), l = cutText(c.amount); return `<button class="chip ${c.amount === st.size ? "on" : ""}" data-size="${c.amount}" ${fits(item, c.amount, st.flavor, 1) ? "" : "disabled"}>${l[0].toUpperCase() + l.slice(1)}${cp != null ? " · " + price(cp) : ""}</button>`; }).join("")}</div>`
        : sizes.length > 1 ? `<div class="label">${t("Объём", "Size")}</div><div class="wrap">${sizes.map(s => `<button class="chip ${s === st.size ? "on" : ""}" data-size="${s}">${s} ${unit(item.variants[0].unit)}</button>`).join("")}</div>` : ""}
      ${addonsFor(item).length ? `<div class="label">${t("Добавки", "Add-ons")}</div>
        ${(st.addons || []).length ? `<div class="wrap">${addonsFor(item).filter(a => st.addons.includes(a.id)).map(a =>
          `<button class="chip on" data-unextra="${esc(a.id)}">${esc(addonName(a))}${a.price ? " +" + price(a.price) : ""} ✕</button>`).join("")}</div>` : ""}
        <button class="btn line" data-act="extras-open">${(st.addons || []).length ? t("Изменить добавки", "Change add-ons") : t("Выбрать добавки", "Choose add-ons")}</button>` : ""}

      ${item.flavors ? `<div class="label">${item.choice ? L(item.choice) : groups.some(Boolean) ? t("Сорт", "Tea") : t("Вкус", "Flavor")}</div>${groups.map(g =>

      ${renderCustomization(v, st)}
      ${nutrition ? `<div class="label">${t("Пищевая ценность", "Nutrition")}</div><div class="table">
        <div><span>${t("На порцию", "Per serving")}${excluded.length ? "" : ` (${v.unit === "cut" ? cutText(v.amount) : v.unit === "pc" ? "1 " + unit("pc") : v.amount + " " + unit(v.unit)})`}</span><b>${excluded.length ? "≈ " : ""}${kbju({ ...nutrition, kcal: Math.round(nutrition.kcal) })}</b></div>
        ${!excluded.length && v.per100 ? `<div><span>${t("На 100 г", "Per 100 g")}</span><b>${kbju(v.per100)}</b></div>` : ""}</div>
        <div class="note">${t("Ккал / Б / Ж / У", "Kcal / P / F / C")}</div>`
        : excluded.length ? `<p class="note">${t("КБЖУ для этого состава пока нет", "Nutrition for these options is unavailable")}</p>` : ""}
      <div class="label">${t("Аллергены", "Allergens")}</div>
      <div style="font-size:14px">${v.allergens?.length ? `<b>${t("Содержит:", "Contains:")}</b> ${al(v.allergens)}` : ""}
        ${v.mayContain?.length ? `<div><b>${t("Может содержать:", "May contain:")}</b> ${al(v.mayContain)}</div>` : ""}
        ${!v.allergens?.length && !v.mayContain?.length ? t("Основные аллергены по техкарте не указаны", "No major allergens are listed on the recipe card") : ""}</div>
      <p class="note">${t("При аллергии уточните состав и риск контакта у бариста.", "If you have an allergy, ask the barista about ingredients and the risk of cross-contact.")}</p>
    </div>
    <div class="bar"><div class="item-cart-summary"><span id="item-cart-count" role="status" aria-atomic="true">${inCart
      ? `${t("В корзине", "In cart")} · ${cartUnits(inCart)}` : ""}</span>${inCart
      ? `<button data-tab="order">${t("К корзине", "Go to cart")}</button>` : ""}</div>
      <div class="in"><div class="qty"><button data-act="minus">−</button><span>${st.qty}</span><button data-act="plus">+</button></div>
      <button class="btn" id="item-add" data-act="add" ${ok ? "" : "disabled"}>${item.flavors && !st.flavor ? (item.choice ? t("Выберите ", "Choose a ") + L(item.choice).toLowerCase() : groups.some(Boolean) ? t("Выберите сорт", "Choose a tea") : t("Выберите вкус", "Choose a flavor"))
        : itemAvailable(item) && !enough ? t("Столько не осталось", "Not that many left")
          : (inCart ? t("Добавить ещё", "Add more") : t("В заказ", "Add to order")) + (p != null ? " · " + price(p * st.qty) : "")}</button></div></div>
  </div>`;
}

    <div class="wrap"><button class="chip ${a.mode === "signin" ? "on" : ""}" data-act="signin-mode">${t("Вход", "Sign in")}</button>
      <button class="chip ${a.mode === "register" ? "on" : ""}" data-act="register-mode">${t("Регистрация", "Register")}</button></div>
    ${signingIn ? `<input class="field" id="a-phone" autocapitalize="off" autocomplete="username" placeholder="${t("Телефон или логин", "Phone or login")}" value="${esc(a.phone)}">`
      : !S.bot ? `<p class="note warn">${t("Подтверждение номера через Telegram сейчас недоступно. Попробуйте чуть позже.", "Phone verification through Telegram is unavailable. Please try again later.")}</p>`
      : !a.checked ? `<div style="font-weight:600;font-size:14px">${a.mode === "reset" ? t("Чтобы задать новый пароль, подтвердите номер в Telegram: бот DAD попросит поделиться номером.", "To set a new password, confirm your phone in Telegram: the DAD bot asks you to share it.")
          : t("Подтвердите номер в Telegram: бот DAD попросит поделиться номером — это одно нажатие.", "Confirm your phone in Telegram: the DAD bot asks you to share it — one tap.")}</div>

      : `<div style="font-weight:700">✓ ${t("Номер подтверждён:", "Phone confirmed:")} ${esc(phoneText(a.checked))}</div>`}

    ${a.error ? `<div class="warn small" style="font-weight:600">${esc(a.error)}</div>` : ""}

    ${a.mode === "signin" && S.bot ? `<a class="btn line" href="https://t.me/${esc(S.bot)}?start=reset" target="_blank" rel="noopener">${t("Забыли пароль?", "Forgot the password?")}</a>
      <div class="note">${t("Откроется Telegram: бот DAD попросит поделиться номером и написать новый пароль. Потом войдите здесь с новым паролем.",

    <div class="note">${t("Один аккаунт для Android, iPhone и сайта: заказы видны на любом устройстве.", "One account for Android, iPhone and the web: your orders show on any device.")}</div>
  </div>`;
}

/** The guest's open orders (today and later), the current one included. */

  const list = S.history.filter(o => !FINISHED.includes(o.status) && isCurrent(o) && o.token);
  return S.myOrder && !list.some(o => o.id === S.myOrder.id) ? [S.myOrder, ...list] : list;
}
function renderFulfillment() {
  const c = S.checkout;
  const fulfillment = [
    ["dinein", t("В зале", "Dine in")], ["pickup", t("Самовывоз", "Pickup")], ["delivery", t("Доставка", "Delivery")],
  ];
  return `<div style="margin:12px 0"><div class="label">${t("Как получить заказ", "How to get your order")}</div>

      `<button class="chip ${c.fulfillment === mode ? "on" : ""}" data-act="${mode}-mode" aria-pressed="${c.fulfillment === mode}" ${c.busy ? "disabled" : ""}>${label}</button>`
    ).join("")}</div></div>`;
}
function renderCart() {
  // A placed order never blocks the next one: with something in the cart the cart comes first, the open orders are
  // cards above it; with an empty cart the current order is shown, with «Дозаказать».
  if (S.myRef && (!S.cart.length || S.viewing)) {
    const open = openOrders();
    return `<div class="page">${topBar()}
      ${open.length > 1 ? `<div class="wrap" style="margin-top:8px">${open.map(o => `<button class="chip ${o.id === S.myOrder?.id ? "on" : ""}" data-open="${o.id}">№${o.number}</button>`).join("")}</div>` : ""}
      ${renderStatus()}
      ${!S.myOrder ? "" : `<div class="stack" style="margin-top:20px">${S.cart.length ? `<button class="btn" data-act="tocart">${t("Вернуться к корзине", "Back to the cart")}</button>`
        : `<button class="btn line" data-tab="menu">${t("Дозаказать", "Order more")}</button>`}</div>`}</div>`;
  }
  const cards = openOrders().map(o => `<button class="ordercard" data-open="${o.id}"><span><b>${t("Заказ", "Order")} №${o.number}</b>
    <small class="${o.status === "unpaid" || deliveryDue(o) ? "warn" : "muted"}">${[o.status === "unpaid" ? t("Ждёт оплаты", "Awaiting payment") : scheduled(o) ? t("Предзаказ принят", "Pre-order accepted") : statusText(o),
      o.pickup_at ? pickupText(o.pickup_at) : null].filter(Boolean).join(" · ")}</small></span><span>›</span></button>`).join("");
  if (!S.cart.length) return `<div class="page">${topBar()}<h1>${t("Мой заказ", "My order")}</h1>
    <div class="empty"><div class="logo big">DAD</div><b>${t("Заказ пуст", "Your order is empty")}</b><p>${t("Добавьте позиции из меню", "Add something from the menu")}</p></div></div>`;
  const total = cartTotal();
  const lines = S.cart.map((l, i) => {
    const r = resolve(l); if (!r) return "";
    const f = r.item.flavors?.find(f => f.id === l.flavor);
    const p = unitPrice(l, r), extras = addonsOf(l);
    const details = [r.v.unit === "cut" ? cutText(r.v.amount) : r.v.unit !== "pc" ? r.v.amount + " " + unit(r.v.unit) : null, r.v.milk && r.v.milk !== "regular" ? MILKS[r.v.milk][S.lang === "ru" ? 0 : 1] : null, f ? L(f.name) : null].filter(Boolean).join(" · ");
    const ok = available(l.id, l.flavor), over = overStock().has(lineKey(l));
    return `<div class="cart-line"><div class="row">${thumb(l.id)}<div class="info"><span class="name">${esc(L(r.item.name))}</span><span class="meta">${esc(details)}</span>
      ${extras.length ? `<span class="meta" style="color:var(--blue);font-weight:600">+ ${esc(extras.map(a => addonName(a).toLowerCase()).join(", "))}</span>` : ""}
      ${ok ? (over ? `<span class="out">${t("Столько не осталось — уменьшите", "Not that many left — reduce it")}</span>` : "") : `<span class="out">${t("Нет в наличии", "Out of stock")}</span>`}</div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">${p != null ? `<span class="price">${price(p * l.quantity)}</span>` : ""}
      <div class="qty" style="height:36px"><button data-dec="${i}" style="height:34px;width:34px">−</button><span>${l.quantity}</span><button data-inc="${i}" style="height:34px;width:34px">+</button></div></div></div>
      ${renderCustomization(r.v, l, i)}</div>`;
  }).join("");
  const nutrition = cartNutrition();
  const nutritionText = nutrition ? `<p class="note">${t("КБЖУ заказа", "Order nutrition")}${nutrition.incomplete ? t(" (частично)", " (partial)") : ""} · ${nutrition.estimate ? "≈ " : ""}${esc(kbju(nutrition.total))}</p>` : "";
  return `<div class="page">${topBar(`<button class="link warn" data-act="empty">${t("Очистить", "Clear")}</button>`)}<h1>${t("Мой заказ", "My order")}</h1>
    ${renderFulfillment()}${cards}${lines}${nutritionText}<div class="total"><span>${t("К оплате", "To pay")}</span><b>${cartFullTotal() != null ? `<s class="muted" style="font-size:.7em;margin-right:8px">${price(cartFullTotal())}</s>` : ""}${total != null ? price(total) : "—"}</b></div>${renderCheckout()}</div>`;
}

function checkoutSchedule(c) {
  const delivery = isDeliveryCheckout(c);
  const asap = !delivery && isOpen();
  const pre = c.later || !asap;
  const all = pre ? slots(delivery ? DELIVERY_DAYS : PREORDER_DAYS) : [];
  const day = Math.max(0, Math.min(c.day, all.length - 1));
  const slot = all[day]?.find(time => time.getTime() === c.slot);
  return { asap, pre, all, day, slot };
}

function renderDeliveryAddress(address) {
  const picker = S.streetPicker;
  const suggestions = picker.open ? matchingDeliveryStreets() : [];
  return `<div class="label">${t("Адрес доставки", "Delivery address")}</div>
    <div class="note">${t("Город", "City")} · ${t(DELIVERY_CITY, "Vladivostok")}</div>
    <div class="delivery-field" id="street-picker">
      <label for="c-street">${t("Улица", "Street")}</label>
      <input class="field" id="c-street" role="combobox" aria-autocomplete="list" aria-controls="delivery-streets"
        aria-expanded="${suggestions.length > 0}" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="120" required
        value="${esc(address.street)}">
      <div id="delivery-streets" class="street-options" role="listbox" aria-label="${t("Подсказки улиц", "Street suggestions")}"
        ${suggestions.length ? "" : "hidden"}>${suggestions.map((name, i) => `<button type="button" role="option" tabindex="-1" id="delivery-street-${i}"
          aria-selected="${i === picker.index}" data-delivery-street="${esc(name)}">${esc(name)}</button>`).join("")}</div>
    </div>
    <div class="delivery-parts">
      <div class="delivery-field"><label for="c-house">${t("Дом", "Building")}</label>
        <input class="field" id="c-house" autocomplete="off" maxlength="40" required value="${esc(address.house)}"></div>
      <div class="delivery-field"><label for="c-apartment">${t("Квартира (необязательно)", "Flat (optional)")}</label>
        <input class="field" id="c-apartment" autocomplete="off" maxlength="30" value="${esc(address.apartment)}"></div>
    </div>
    <div class="delivery-field"><label for="c-details">${t("Подъезд, этаж и другие детали (необязательно)", "Entrance, floor and other details (optional)")}</label>
      <textarea class="field" id="c-details" rows="2" maxlength="${DELIVERY_ADDRESS_MAX}">${esc(address.details)}</textarea></div>`;
}

function renderCheckout() {
  const c = S.checkout;
  const heading = `<div class="heading"><h2>${t("Оформление", "Checkout")}</h2></div>`;
  const delivery = isDeliveryCheckout(c);
  const paused = S.paused ? `<p class="note warn">${delivery
    ? t("Доставка временно недоступна. Приём заказов на паузе.", "Delivery is temporarily unavailable while orders are paused.")
    : t("Приём заказов временно приостановлен.", "Orders are temporarily paused.")}</p>` : "";
  if (!guestPhone()) return heading + paused + `${delivery && !S.paused
    ? `<p class="note">${t("После входа укажите адрес и время. Когда заказ будет готов, бариста согласует стоимость доставки.", "Sign in to enter the address and time. Once the order is ready, a barista will confirm the delivery fee.")}</p>`
    : ""}
    <p style="font-weight:600;font-size:14px">${t("Войдите или зарегистрируйтесь по номеру телефона. При регистрации понадобится подтверждение в Telegram.", "Sign in or register with your phone number. New accounts require verification in Telegram.")}</p>${accountForm()}`;
  if (S.paused) return heading + paused;
  const { asap, pre, all, day, slot } = checkoutSchedule(c);
  const byQr = delivery || c.sbpEarlyAccess;
  const address = delivery ? deliveryAddressText(c.address) : "";
  const blocked = S.cart.some(l => !available(l.id, l.flavor)) || overStock().size > 0;
  const total = cartTotal();
  const reason = blocked ? t("Уберите позиции, которых нет в наличии, или уменьшите количество.", "Remove the items that are out of stock or reduce them.")
    : total == null ? t("У некоторых позиций пока нет цены — такой заказ можно сделать на кассе.", "Some items have no price yet — please order them at the counter.")
    : byQr && total <= 0 ? (delivery ? t("Для доставки нужна корзина с положительной суммой.", "Delivery requires a positive order total.")
      : t("Для заказа с нулевой суммой выберите оплату на кассе.", "Choose payment at the counter for an order with a zero total."))
    : pre && !all.length ? t("Нет свободного времени для предзаказа.", "No pre-order times available.")
    : deliveryAddressTooLong(address) ? t("Сократите адрес и детали доставки до 200 символов.", "Shorten the address and delivery details to 200 characters.") : null;
  const ok = !reason && c.name.trim() && (!pre || slot) && (!delivery || address);
  return `${heading}<div class="stack" style="margin-top:12px">
    <input class="field" id="c-name" placeholder="${t("Ваше имя", "Your name")}" value="${esc(c.name)}">
    <div class="note">${t("Телефон", "Phone")}: ${esc(phoneText(guestPhone()))} · ${t("бариста позвонит, если с заказом что-то не так", "the barista calls if something is wrong")}</div>
    <textarea class="field" id="c-comment" rows="2" placeholder="${t("Комментарий (необязательно)", "Comment (optional)")}">${esc(c.comment)}</textarea>
    ${asap || delivery ? "" : `<div class="warn small" style="font-weight:600">${t("Сейчас мы закрыты — можно оформить предзаказ ко времени.", "We are closed now — you can pre-order for a later time.")} ${hoursStatus()}</div>`}
    ${delivery ? `${renderDeliveryAddress(c.address)}
      <div class="label">${t("К какому времени приготовить", "When to have it ready")}</div>`
      : `<div class="wrap">${asap ? `<button class="chip ${pre ? "" : "on"}" data-act="asap">${t("Как можно скорее", "As soon as possible")}</button>` : ""}<button class="chip ${pre ? "on" : ""}" data-act="later">${t("Ко времени", "For a time")}</button></div>`}
    ${all.length ? `<div class="wrap">${all.map((list, i) => `<button class="chip ${i === day ? "on" : ""}" data-day="${i}">${dayName(list[0])}</button>`).join("")}</div>
      <div class="chips" style="position:static;padding-top:0">${all[day].map(s => `<button class="chip ${slot === s ? "on" : ""}" data-slot="${s.getTime()}">${hhmm(s)}</button>`).join("")}</div>` : ""}
    ${delivery ? `<div class="note">${t("Доставка Яндекс Go. Сначала оплатите заказ по QR. Когда заказ будет готов, бариста позвонит и согласует стоимость доставки. Доставка оплачивается отдельно после согласования.",
      "Yandex Go delivery. First pay for the order by QR. Once the order is ready, the barista calls to agree on the delivery fee. You pay for delivery separately after confirmation.")}</div>`
      : `<div class="label">${t("Оплата на кассе", "Pay at the counter")}</div>
    <div class="wrap">${["card", "cash"].map(p => {
      const selected = !c.sbpEarlyAccess && c.payment === p;
      return `<button class="chip ${selected ? "on" : ""}" data-pay="${p}" aria-pressed="${selected}">${PAYMENTS[p][S.lang === "ru" ? 0 : 1]}</button>`;
    }).join("")}</div>
    <div class="wrap"><button class="chip ${c.sbpEarlyAccess ? "on" : ""}" data-pay="sbp" aria-pressed="${c.sbpEarlyAccess}">${t("СБП по QR · ранний доступ", "SBP by QR · early access")}</button></div>`}
    ${c.error ? `<div class="warn small" style="font-weight:600">${esc(c.error)}</div>` : ""}
    <button class="btn" data-act="place" ${ok && !c.busy ? "" : "disabled"}>${c.busy ? "…" : byQr ? t("Перейти к оплате по QR", "Continue to QR payment") : pre ? t("Оформить предзаказ", "Place pre-order") : t("Отправить заказ", "Place order")}</button>
    <div class="note ${reason ? "warn" : ""}">${reason || (delivery && !address ? t("Укажите улицу и дом.", "Enter the street and building.")
      : pre && !slot ? t("Выберите время, к которому приготовить заказ.", "Choose when to have the order ready.")
      : byQr ? t("После оплаты нажмите «Я оплатил». Бариста проверит поступление перед принятием заказа.", "Once you have paid, tap “I have paid”. The barista checks the payment before accepting the order.")
      : t("Оплатите заказ на кассе при получении.", "Pay at the counter when you pick up."))}</div>
  </div>`;
}

function orderItemNotes(line) {
  const omissions = Array.isArray(line.omission_names) ? line.omission_names.map(L).filter(Boolean) : [];
  const notes = [
    line.no_sauce === true ? withoutSauce(line.sauce_name) : "",
    omissions.length ? t("Убрать из порции", "Remove from this serving") + " · " + omissions.join(", ") : "",
    itemComment(line.item_comment),
  ];
  return notes.filter(Boolean).map(note => `<span class="order-item-note">${esc(note)}</span>`).join("");
}

function renderStatus() {
  const o = S.myOrder;
  if (!o) return `<div class="empty"><div class="logo big">DAD</div><p>…</p></div>`;
  const title = awaitsPrepay(o) ? t("Оплатите заказ — готовить начнём после оплаты", "Please pay — we start cooking once it is paid")
    : scheduled(o) ? t("Предзаказ принят", "Pre-order accepted") : statusText(o);
  const alarming = ["waiting", "rejected", "cancelled", "no_show"].includes(o.status) || awaitsPrepay(o);
  const reached = o.status === "unpaid" ? null : scheduled(o) || awaitsPrepay(o) ? 0 : { new: 0, waiting: 0, accepted: 1, ready: 2, done: 2 }[o.status];
  const steps = reached == null ? "" : `<div class="steps">${[t("Отправлен", "Sent"), t("Готовится", "Preparing"), t("Готов", "Ready")].map((s, i) => `<div class="${i <= reached ? "on" : ""}"><i></i>${s}</div>`).join("")}</div>`;
  let actions = "";
  if (o.status === "waiting") actions = renderResolve(o);
  else if (o.status === "unpaid") {
    // Pay first: the order reaches the barista only after «Я оплатил».
    actions = isEarlySbp(o) && !canPayEarly(o)
      ? `<div class="note warn">${t("Оплата недоступна. Если деньги уже отправлены, обратитесь к бариста.", "Payment is unavailable. If you already paid, contact the barista.")}</div>`
      : `<button class="btn" data-act="pay">${t("Оплатить по QR", "Pay by QR")}${o.total != null ? " · " + price(o.total) : ""}</button>
      <button class="btn line" data-act="paid">${t("Я оплатил", "I have paid")}</button>
      <button class="btn line" data-act="cancel">${t("Отменить заказ", "Cancel order")}</button>
      <div class="note center">${t("Неоплаченный заказ отменится сам через 30 минут.", "An unpaid order is cancelled by itself after 30 minutes.")}</div>`;
  } else if (["new", "accepted", "ready"].includes(o.status)) {
    actions = o.paid ? `<div class="center" style="font-weight:700">✓ ${t("Оплачено", "Paid")}</div>`
      : ["card", "cash"].includes(o.payment) ? `<div class="center" style="font-weight:700">${t("Оплата на кассе при получении", "Pay at the counter when you pick up")}</div>`
      : o.paid_claimed ? `<div class="center" style="font-weight:700">${t("Вы отметили оплату. Бариста проверит поступление.", "You marked the order as paid. The barista will check the payment.")}</div>`
      : o.status !== "new" ? `<button class="btn" data-act="pay">${t("Оплатить по QR", "Pay by QR")}</button><button class="btn line" data-act="paid">${t("Я оплатил", "I have paid")}</button>` : "";
    if (canCancel(o)) actions += `<button class="btn line" data-act="cancel">${t("Отменить заказ", "Cancel order")}</button>`;
  } else actions = `<button class="btn" data-act="neworder">${t("Новый заказ", "New order")}</button>`;
  return `<div class="stack order-status"><div class="order-status-header">
    <div class="label muted">${t("Заказ", "Order")}</div>
    <div class="num">№${o.number}</div>
    <div class="order-status-title ${alarming ? "warn" : ""}">${title}</div>
    ${o.pilot_checkout && !o.delivery_address && typeof o.takeaway === "boolean"
      ? `<div class="order-status-time">${o.takeaway ? t("Самовывоз", "Pickup") : t("В зале", "Dine in")}</div>` : ""}
    ${o.pickup_at ? `<div class="order-status-time">${t("Ко времени", "Ready by")} · ${pickupText(o.pickup_at)}</div>` : ""}
    </div>
    ${steps}
    ${o.status === "waiting" ? "" : `<div class="order-items">${o.items.map(l => `<div class="order-item">
      <span class="order-item-name">${l.quantity} × ${esc(l.title)}${l.unit === "cut" ? " · " + esc(cutText(l.amount)) : ""}${l.flavor ? " · " + esc(l.flavor) : ""}${l.addons?.length ? " + " + esc(l.addons.map(a => a.name.toLowerCase()).join(", ")) : ""}
        ${orderItemNotes(l)}</span>
      ${l.price != null ? `<span class="order-item-price">${price(l.price * l.quantity)}</span>` : ""}</div>`).join("")}
      <div class="order-item order-item-total"><span class="order-item-name muted">${PAYMENTS[o.payment || "sbp"][S.lang === "ru" ? 0 : 1]}</span><b class="order-item-price">${o.total != null ? price(o.total) : ""}</b></div></div>`}
    ${o.delivery_address ? renderDelivery(o) : ""}
    ${actions}</div>${S.pay ? renderPay() : ""}`;
}

/** Delivery: the address, then the price the barista set after the call and «Оплатить доставку». */
function renderDelivery(o) {
  const fee = o.delivery_fee;
  const state = fee == null ? (FINISHED.includes(o.status) ? "" : `<div class="note">${t("Когда заказ будет готов, бариста позвонит и согласует стоимость доставки.", "Once the order is ready, the barista will call to agree on the delivery fee.")}</div>`)
    : o.delivery_paid ? `<div style="font-weight:700">✓ ${t("Доставка оплачена", "Delivery paid")} · ${price(fee)}</div>`
    : o.delivery_paid_claimed ? `<div style="font-weight:700">✓ ${t("Вы оплатили доставку — бариста проверит", "You paid for delivery — the barista checks it")}</div>`
    : deliveryDue(o) ? `<button class="btn" data-act="paydelivery">${t("Оплатить доставку", "Pay for delivery")} · ${price(fee)}</button>
       <button class="btn line" data-act="deliverypaid">${t("Я оплатил доставку", "I have paid for delivery")}</button>` : "";
  return `<div class="stack" style="border:1.5px solid var(--blue);border-radius:14px;padding:12px">
    <div style="font-weight:700">🚚 ${t("Доставка Яндекс Go", "Yandex Go delivery")}</div><div class="order-item-name">${esc(o.delivery_address)}</div>${state}</div>`;
}

/** The only question the guest is ever asked: a replacement for what ran out, or go on without it. */
function renderResolve(o) {
  S.choice ||= {};
  const earlySbp = isEarlySbp(o);
  const refundOnly = earlySbp && o.items.every(line => line.missing) && !Object.values(S.choice).some(Boolean);
  const alts = (line) => {
    const cat = S.menu.sections.flatMap(s => s.categories).find(c => c.id !== "new" && c.items.some(i => i.id === line.item_id));
    return (cat?.items || []).filter(i => i.id !== line.item_id && !i.flavors && itemAvailable(i)).slice(0, 8);
  };
  const lineText = l => `${l.quantity} × ${esc(l.title)}`;
  return `<div class="stack">${o.items.map((l, i) => l.missing ? `<div class="card"><b class="warn" style="text-decoration:line-through">${lineText(l)}</b>${orderItemNotes(l)}
      <div class="small">${t("Закончилось. Заменить на:", "Ran out. Replace with:")}</div>
      <div class="wrap"><button class="chip ${S.choice[i] ? "" : "on"}" data-choice="${i}|">${t("Без замены", "No replacement")}</button>
      ${alts(l).map(a => `<button class="chip ${S.choice[i] === a.id ? "on" : ""}" data-choice="${i}|${a.id}">${esc(L(a.name))}</button>`).join("")}</div></div>`
    : `<div>${lineText(l)} ✓${orderItemNotes(l)}</div>`).join("")}
    ${refundOnly
      ? `<div class="note">${t("Выберите замену или свяжитесь с кофейней для возврата.", "Choose a replacement or contact the café for a refund.")} <a href="tel:${PHONE}">${PHONE_TEXT}</a></div>`
      : `<button class="btn" data-act="resolve">${t("Готово — на кухню", "Done — send to the kitchen")}</button>
         <div class="note">${t("Если замена дешевле или без замены, разницу вернут при выдаче.", "If the replacement costs less, or you skip it, the difference is refunded at pickup.")}</div>`}
    ${earlySbp && !refundOnly ? `<div class="note">${t("Для отмены оплаченного заказа обратитесь к бариста.", "Contact the barista to cancel an order after paying.")}</div>` : ""}
    ${earlySbp ? "" : `<button class="btn line" data-act="cancel">${t("Отменить заказ", "Cancel order")}</button>`}</div>`;
}

function renderPay() {
  // S.pay is the sum to pay: the order, or the delivery the barista priced after the call.
  const total = typeof S.pay === "number" ? S.pay : S.myOrder?.total;
  const link = paymentLink(total);
  return `<div class="sheet"><button class="close" data-act="closepay">←</button><div class="body stack" style="padding-top:72px">
    <h3 class="center">${t("Оплата по QR", "Pay by QR")}</h3>
    ${total != null ? `<div class="num" style="font-size:44px">${price(total)}</div>` : ""}
    <div id="qr" class="qr" data-link="${esc(link)}"></div>
    <a class="btn" href="${esc(link)}">${t("Открыть в приложении банка", "Open in the bank app")}</a>
    ${total != null ? `<button class="btn line" data-act="copysum">${t("Скопировать сумму", "Copy the amount")} ${total}</button>
      <div class="note">${t("Сумма передаётся в банк вместе с QR. Если банк попросит ввести её сам — вставьте скопированную.", "The amount is passed to the bank with the QR. If your bank asks for it, paste the copied amount.")}</div>` : ""}
    ${typeof S.pay === "number"
      ? `<button class="btn line" data-act="deliverypaid">${t("Я оплатил доставку", "I have paid for delivery")}</button>`
      : S.pay === true && isEarlySbp(S.myOrder)
      ? `<button class="btn line" data-act="paid">${t("Я оплатил", "I have paid")}</button>
        <div class="note">${t("Бариста проверит поступление. Оплатите заказ один раз.", "The barista will check the payment. Pay for the order once.")}</div>`
      : `<div class="note">${t("После оплаты вернитесь к заказу и нажмите «Я оплатил».", "After paying, come back and tap “I have paid”.")}</div>`}</div></div>`;
}

function render() {
  if (S.pay === true && isEarlySbp(S.myOrder) && !canPayEarly(S.myOrder)) S.pay = null;
  if (typeof S.pay === "number" && (!deliveryDue(S.myOrder) || S.myOrder.delivery_fee !== S.pay)) S.pay = null;
  const keepScroll = window.scrollY;
  const sheetScroll = document.getElementById("sheet")?.scrollTop;
  const focus = document.activeElement?.id, caret = document.activeElement?.selectionStart;
  let html = S.tab === "order" ? renderCart() : S.tab === "account" ? renderAccount() : renderMenu();
  html += tabs() + (S.item ? renderItem() : "") + (S.item && S.extras ? renderExtras() : "");
  if (window.morphdom) {
    // Only what changed is touched: the field being typed in keeps its keyboard (digits stay digits on iPhone),
    // photos are not loaded again and the QR stays drawn.
    const next = document.createElement("div"); next.id = "app"; next.innerHTML = html;
    morphdom($app, next, { onBeforeElUpdated: (from, to) =>
      !(from === document.activeElement && ["INPUT", "TEXTAREA"].includes(from.tagName)) &&
      !(from.id === "qr" && from.dataset.link === to.dataset.link) && !from.isEqualNode(to) });
  } else {
    $app.innerHTML = html;
    if (focus) { const el = document.getElementById(focus); if (el) { el.focus(); try { el.setSelectionRange(caret, caret); } catch {} } }
    const sheet = document.getElementById("sheet");
    if (sheet && sheetScroll != null) sheet.scrollTop = sheetScroll;
  }
  document.documentElement.lang = S.lang;
  document.body.style.overflow = S.item || S.pay ? "hidden" : "";
  const street = document.getElementById("c-street");
  if (street) {
    const expanded = !document.getElementById("delivery-streets").hidden;
    street.setAttribute("aria-expanded", expanded);
    const option = expanded && document.getElementById("delivery-street-" + S.streetPicker.index);
    if (option) street.setAttribute("aria-activedescendant", option.id);
    else street.removeAttribute("aria-activedescendant");
  }
  const qr = document.getElementById("qr");
  if (qr && !qr.firstChild && window.QRCode) new QRCode(qr, { text: qr.dataset.link, width: 212, height: 212, colorDark: "#1F2B8E", colorLight: "#FFFFFF" });
  if (!window.morphdom) window.scrollTo(0, keepScroll);
}
function toast(text) {
  const el = document.createElement("div"); el.className = "toast"; el.textContent = text;
  document.body.appendChild(el); setTimeout(() => el.remove(), 1600);
}
const errorText = (e) => ({
  closed: t("Кофейня сейчас закрыта", "The café is closed now"), paused: t("Приём заказов временно приостановлен", "Orders are paused for now"),
  bad_time: t("Это время уже недоступно — выберите другое", "That time is no longer available — pick another"),

/** Polls which phone Telegram confirmed for the code (the guest shares the contact with the bot). */
async function waitForPhone(code) {
  for (let i = 0; i < 900 && S.account.code === code && !S.account.checked; i++) {
    try {
      const phone = await rpc("checked_phone", { p_code: code });
      if (S.account.code !== code) return;
      if (phone) { S.account.checked = phone; render(); return; }
    } catch {}
    await new Promise(r => setTimeout(r, 2000));
  }
}

// ── Events ──────────────────────────────────────────────────────────────────
function typedPhone(event) {
  const field = event.target, raw = field.value;
  if (event.isComposing || event.inputType?.startsWith("delete")) return raw;
  const formatted = phoneText(raw, true);
  if (formatted === raw) return raw;
  // Keep edits in the middle of the number at the same digit after adding spaces or the country code.
  const numberLength = (text) => text.replace(/\D/g, "").length;
  const digitsBefore = numberLength(raw.slice(0, field.selectionStart)) + numberLength(formatted) - numberLength(raw);
  let caret = 0, seen = 0;
  while (caret < formatted.length && seen < digitsBefore) {
    if (/\d/.test(formatted[caret])) seen++;
    caret++;
  }
  field.value = formatted;
  field.setSelectionRange?.(caret, caret);
  return formatted;
}
const DELIVERY_FIELDS = { "c-street": "street", "c-house": "house", "c-apartment": "apartment", "c-details": "details" };
// Safari's password autofill may fill the fields without an input event: change counts too.
const onField = (e) => {
  const id = e.target.id, v = e.target.value;
  if (id === "q") { S.query = v; render(); }
  else if (id === "x-q" && S.extras) { S.extras.q = v; render(); }
  else if (id === "a-phone") {
    S.account.phone = e.type === "input" ? typedPhone(e) : phoneText(v);
    if (e.target.value !== S.account.phone) e.target.value = S.account.phone;
  }
  else if (id === "a-name") { S.account.name = v; render(); }
  else if (id === "a-pass") { S.account.password = v; render(); }
  else if (id === "c-name") { S.checkout.name = v; store.set("name", v); render(); }
  else if (id === "c-comment") { S.checkout.comment = v; }
  else if (DELIVERY_FIELDS[id]) {
    const field = DELIVERY_FIELDS[id];
    if (S.checkout.address[field] === v) return;
    setAddressField(field, v);
    if (field === "street") Object.assign(S.streetPicker, { open: e.type === "input", index: -1 });
    render();
  }
  else if (id === "item-comment-item" && S.item) { S.item.item_comment = v; }
  else if (id?.startsWith("item-comment-") && !S.checkout.busy) {
    const index = Number(id.slice("item-comment-".length)), line = S.cart[index];
    if (!line) return;
    line.item_comment = v;
    store.set("cart", S.cart);
  }
};
document.addEventListener("input", onField);

function mergeCustomizedCartLine(index) {
  const line = S.cart[index];
  const same = S.cart.find((other, i) => i !== index && other.quantity < 20 && lineKey(other) === lineKey(line));
  if (!same) return;
  const moved = Math.min(20 - same.quantity, line.quantity);
  same.quantity += moved;
  line.quantity -= moved;
  if (!line.quantity) S.cart.splice(index, 1);
}

function updateIngredientSelection(d) {
  const inItem = d.itemSauce != null || d.optionsFor === "item";
  const index = Number(d.cartSauce ?? d.optionsFor);
  const selection = inItem ? S.item : S.cart[index];
  if (!selection || (!inItem && S.checkout.busy)) return;
  const item = inItem ? findItem(selection.id) : null;
  const variant = inItem ? (item && draftVariant(item, selection)) : resolve(selection)?.v;
  if (!variant) return;

  if (d.itemSauce != null || d.cartSauce != null) {
    if (!variant.removableSauce) return;
    selection.noSauce = selection.noSauce !== true;
  } else {
    if (!eligibleIngredients(variant).some(ingredient => ingredient.id === d.omit)) return;
    const chosen = new Set(omissionIds(selection));
    if (chosen.has(d.omit)) chosen.delete(d.omit);
    else chosen.add(d.omit);
    selection.omissions = [...chosen].sort();
  }
  if (!inItem) {
    mergeCustomizedCartLine(index);
    store.set("cart", S.cart);
  }
  render();
}

        return [{ item_id: alt.id, title: alt.name.ru, amount: v.amount, unit: v.unit, milk: null, flavor_id: null, flavor: null, quantity: l.quantity, price: itemPrice(alt, v) }];
      });
      try { await guestAction(items.length ? "resolve" : "cancel", items.length ? items : undefined); S.choice = {}; }
      catch (err) { if (err.code === "unavailable") { err.ids.forEach(id => S.stop.add(id)); S.choice = {}; toast(t("Эта замена тоже закончилась", "That one ran out too")); } }
      render(); break;
    }
    case "neworder": setRef(null); render(); break;
    case "tocart": S.viewing = false; render(); break;
    case "pay":
      if (!isEarlySbp(S.myOrder) || canPayEarly(S.myOrder)) S.pay = true;
      render(); break;
    case "paydelivery":
      if (deliveryDue(S.myOrder)) S.pay = S.myOrder.delivery_fee;
      render(); break;
    case "deliverypaid":
      if (deliveryDue(S.myOrder)) {
        try { await guestAction("delivery_paid"); S.pay = null; } catch (err) { toast(errorText(err)); }
      }
      render(); break;
    case "closepay": S.pay = null; render(); break;
    case "copysum": try { await navigator.clipboard.writeText(String(typeof S.pay === "number" ? S.pay : S.myOrder.total)); toast(t("Сумма скопирована", "Amount copied")); } catch {} break;
  }
});

// ── Start ───────────────────────────────────────────────────────────────────
(async () => {
  render();
  fetch("delivery-streets.json").then(r => r.ok ? r.json() : []).then(rows => {
    if (!Array.isArray(rows)) return;
    S.streets = [...new Set(rows.filter(name => typeof name === "string" && name.trim()).map(name => name.trim()))]
      .map(name => ({ name, search: streetSearchKey(name) }));
    if (S.streetPicker.open) render();
  }).catch(() => {});
  // Everything at once: the menu file, the server data and the guest's order load in parallel.
  const server = loadServer(), mine = refreshMyOrder();
  // Bundled photos: the kitchen's (credited) and the bar's illustrations (photos.json lists every one).
  const [menu, credits, bundled] = await Promise.all([fetch("menu.json").then(r => r.json()), fetch("photo_credits.json").then(r => r.json()).catch(() => ({})),
    fetch("photos.json").then(r => r.json()).catch(() => [])]);
  S.bundled = menu; PHOTOS = new Set([...Object.keys(credits), ...bundled]); merge(); render();
  await Promise.all([server, mine]); merge(); render();
  // Keep the order status, stop-list and prices fresh while the page is open.
  // With an order on the way: every 5 s; otherwise the history once a minute. The page is drawn again only when
  // something changed, not on every poll.
  let rounds = 0;
  setInterval(async () => {
    if (document.hidden) return;
    const showingEarlyQr = S.pay === true && isEarlySbp(S.myOrder);
    const before = JSON.stringify([S.history.map(o => [o.id, o.status, o.updated_at]), S.myOrder?.status, S.myOrder?.updated_at, S.myRef]);
    if (S.session && (S.myRef || S.tab !== "menu" || rounds % 12 === 0)) await refreshMyOrders();
    if (S.myRef) await refreshMyOrder();
    rounds++;
    const after = JSON.stringify([S.history.map(o => [o.id, o.status, o.updated_at]), S.myOrder?.status, S.myOrder?.updated_at, S.myRef]);
    const outdatedDeliveryQr = typeof S.pay === "number" && (!deliveryDue(S.myOrder) || S.myOrder.delivery_fee !== S.pay);
    if ((showingEarlyQr && !canPayEarly(S.myOrder)) || outdatedDeliveryQr
      || (before !== after && !S.item && !S.pay && !["INPUT", "TEXTAREA"].includes(document.activeElement?.tagName))) render();
  }, POLL_MS);
  document.addEventListener("visibilitychange", async () => { if (!document.hidden) { await Promise.all([loadServer(), refreshMyOrder()]); render(); } });
})();
</script>
